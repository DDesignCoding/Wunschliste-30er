<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meine Wunschliste</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <header class="hero">
      <p class="eyebrow">Geschenkideen</p>
      <h1>Meine <span class="grad">Wunschliste</span></h1>
      <p class="subtitle">Bitte hake das Geschenk ab,<br>welches du schenken willst :)</p>

      <!-- 3D-Geschenk (reines CSS) -->
      <div class="gift-stage" aria-hidden="true">
        <div class="glow"></div>
        <span class="confetti c1"></span>
        <span class="confetti c2"></span>
        <span class="confetti c3"></span>
        <span class="confetti c4"></span>
        <span class="confetti c5"></span>
        <div class="floor"></div>

        <div class="gift-float">
          <div class="gift-tilt">
            <div class="gift-spin">
              <div class="gift-center">

                <!-- Box -->
                <div class="cb box ribbon">
                  <span class="f front"></span><span class="f back"></span>
                  <span class="f right"></span><span class="f left"></span>
                  <span class="f top"></span><span class="f bottom"></span>
                </div>

                <!-- Deckel + Schleife (hüpft) -->
                <div class="lid-group">
                  <div class="cb lid ribbon">
                    <span class="f front"></span><span class="f back"></span>
                    <span class="f right"></span><span class="f left"></span>
                    <span class="f top"></span><span class="f bottom"></span>
                  </div>

                  <div class="cb knot">
                    <span class="f front"></span><span class="f back"></span>
                    <span class="f right"></span><span class="f left"></span>
                    <span class="f top"></span><span class="f bottom"></span>
                  </div>

                  <div class="bow a">
                    <span class="loop l"></span><span class="loop r"></span>
                  </div>
                  <div class="bow b">
                    <span class="loop l"></span><span class="loop r"></span>
                  </div>
                </div>

              </div>
            </div>
          </div>
        </div>
      </div>
    </header>

    <div id="status" class="status" hidden></div>
    <div id="lists"></div>

    <footer class="footer">Danke, dass du an mich denkst ✦</footer>
  </main>

  <script type="module" src="script.js"></script>
</body>
</html>
