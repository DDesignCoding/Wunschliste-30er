<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meine Wunschliste</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <header class="hero">
      <h1>Meine Wunschliste</h1>
      <p class="subtitle">Bitte hake das Geschenk,<br>welches du schenken willst ab :)</p>

      <!-- Bubbly Geschenk-Animation -->
      <div class="gift-stage" aria-hidden="true">
        <span class="spark s1"></span>
        <span class="spark s2"></span>
        <span class="spark s3"></span>
        <div class="gift-float">
          <div class="gift-spin">
            <svg class="gift" viewBox="0 0 220 240" xmlns="http://www.w3.org/2000/svg">
              <ellipse class="shadow" cx="110" cy="226" rx="70" ry="9"/>
              <!-- Box -->
              <rect x="40" y="110" width="140" height="110" rx="26" fill="#a78bfa"/>
              <rect x="40" y="110" width="140" height="30" rx="15" fill="#8b6cf0" opacity=".35"/>
              <rect x="94" y="110" width="32" height="110" fill="#fcd34d"/>
              <!-- Glanz -->
              <rect x="54" y="150" width="12" height="38" rx="6" fill="#fff" opacity=".45"/>
              <!-- Deckel -->
              <g class="lid">
                <rect x="28" y="78" width="164" height="46" rx="23" fill="#c4b5fd"/>
                <rect x="94" y="78" width="32" height="46" fill="#fde68a"/>
                <rect x="44" y="86" width="30" height="9" rx="4.5" fill="#fff" opacity=".5"/>
                <!-- Schleife -->
                <path d="M110 78 C 70 28, 30 56, 62 76 C 80 86, 100 82, 110 78Z" fill="#fb7185"/>
                <path d="M110 78 C 150 28, 190 56, 158 76 C 140 86, 120 82, 110 78Z" fill="#fb7185"/>
                <path d="M72 60 C 62 62, 58 68, 66 72" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".5"/>
                <circle cx="110" cy="76" r="14" fill="#f43f5e"/>
                <circle cx="106" cy="72" r="4" fill="#fff" opacity=".55"/>
              </g>
              <!-- Gesicht -->
              <g class="face">
                <circle cx="85" cy="168" r="6" fill="#3b2a73"/>
                <circle cx="135" cy="168" r="6" fill="#3b2a73"/>
                <circle cx="87" cy="166" r="2" fill="#fff"/>
                <circle cx="137" cy="166" r="2" fill="#fff"/>
                <path d="M100 180 Q110 192 120 180" fill="none" stroke="#3b2a73" stroke-width="4" stroke-linecap="round"/>
                <ellipse cx="72" cy="182" rx="8" ry="5" fill="#fb7185" opacity=".5"/>
                <ellipse cx="148" cy="182" rx="8" ry="5" fill="#fb7185" opacity=".5"/>
              </g>
            </svg>
          </div>
        </div>
      </div>
    </header>

    <div id="status" class="status" hidden></div>
    <div id="lists"></div>

    <footer class="footer">Mit 💜 gemacht</footer>
  </main>

  <script type="module" src="script.js"></script>
</body>
</html>
